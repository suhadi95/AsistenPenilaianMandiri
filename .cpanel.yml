---
deployment:
  tasks:
    - export DEPLOYPATH=/home/suhadipc/public_html/web_apm/public
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/mkdir -p $DEPLOYPATH/uploads
    - /bin/cp -R assets core services $DEPLOYPATH/
    - /bin/cp api.php config.example.php database.sql index.php install.php README.md $DEPLOYPATH/
    - /bin/cp .htaccess $DEPLOYPATH/.htaccess
    - /bin/chmod 755 $DEPLOYPATH
    - /bin/chmod 755 $DEPLOYPATH/assets $DEPLOYPATH/core $DEPLOYPATH/services $DEPLOYPATH/uploads
    - /bin/chmod 644 $DEPLOYPATH/.htaccess $DEPLOYPATH/*.php
